name: Daily Commit

on:
  schedule:
    # Runs at 9:00 AM Manila time (1:00 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append character and commit
        run: |
          echo -n "." >> README.md
          git config user.name "RetsardCo"
          git config user.email "richardmampo.rm@gmail.com"
          git add README.md
          git commit -m "Daily commit: $(date -u +%Y-%m-%d)"
          git push
